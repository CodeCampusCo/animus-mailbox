name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The validate job installs the latest Claude Code, whose checks can tighten with no commit here.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s tests

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Marketplace, plugin and skill manifests
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict skills
